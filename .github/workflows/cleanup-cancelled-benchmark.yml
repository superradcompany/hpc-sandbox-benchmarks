name: Cleanup cancelled benchmark 34643423632
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'superradcompany/hpc-sandbox-benchmarks' && github.ref == 'refs/heads/superrad-benchmarks-parallel'
    environment: privileged
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Remove and verify cancelled benchmark sandboxes
        env:
          MSB_API_URL: ${{ secrets.MSB_API_URL }}
          MSB_API_KEY: ${{ secrets.MSB_API_KEY }}
        shell: python
        run: |
          import concurrent.futures, datetime, json, os, time, urllib.request, urllib.error, urllib.parse
          base = (os.environ.get('MSB_API_URL') or 'https://api.microsandbox.dev').rstrip('/')
          assert base.startswith('https://')
          if not base.endswith('/v1'): base += '/v1'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer '+os.environ['MSB_API_KEY'], 'User-Agent': 'microsandbox-benchmark-cleanup', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      body = r.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == 'GET': return None
                  detail = e.read(1000).decode(errors='replace').replace(os.environ['MSB_API_KEY'], '[redacted]')
                  raise RuntimeError(f'{method} {path}: HTTP {e.code}: {detail}') from None
          def inventory():
              rows, cursor, seen = [], None, set()
              for _ in range(100):
                  page = request('/sandboxes?' + urllib.parse.urlencode({'limit':100, **({'cursor':cursor} if cursor else {})}))
                  rows.extend(page['data'])
                  cursor = page.get('next_cursor')
                  if not cursor:
                      assert not page.get('has_more')
                      return rows
                  assert cursor not in seen
                  seen.add(cursor)
              raise RuntimeError('Inventory pagination exceeded limit')
          def owned(s):
              created = datetime.datetime.fromisoformat(s['created_at'].replace('Z','+00:00'))
              return (s['org_id'] == '561e4943-7312-480d-8914-fa4c6eac3492'
                  and s['name'].startswith('bench-cloud-') and s['ephemeral'] is True
                  and s['spec'].get('labels',{}).get('sandbox-benchmarks.provider') == 'microsandbox-cloud'
                  and datetime.datetime.fromisoformat('2026-09-11T20:17:29+00:00') <= created <= datetime.datetime.fromisoformat('2026-09-11T20:39:29+00:00'))
          rows = inventory()
          targets = [s for s in rows if owned(s)]
          print(json.dumps({'inventory_count':len(rows), 'targets':[{'id':s['id'],'name':s['name'],'status':s['status']} for s in targets]}), flush=True)
          def remove(s):
              current = request('/sandboxes/'+s['id'])
              if current is None: return
              assert owned(current) and current['name'] == s['name']
              request('/sandboxes/'+s['id'], 'DELETE')
              for _ in range(60):
                  if request('/sandboxes/'+s['id']) is None:
                      print('Verified absent '+s['id'], flush=True)
                      return
                  time.sleep(2)
              raise RuntimeError('Still present: '+s['id'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              list(pool.map(remove,targets))
          remaining = inventory()
          assert not any(owned(s) for s in remaining)
          print(json.dumps({'verified_removed':len(targets), 'remaining':[{'name':s['name'],'status':s['status']} for s in remaining]}), flush=True)
