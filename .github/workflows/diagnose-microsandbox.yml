name: Diagnose Microsandbox
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Create one guest, run on a verified guest, or clean up.'
        type: choice
        required: true
        options: [create, run, cleanup]
      configuration:
        description: 'Explicit diagnostic configuration; results are not published benchmark samples.'
        type: choice
        required: true
        options: [openclaw-v2-all-throttled-fd16384-v1, openclaw-v2-all-throttled-fd-v1, openclaw-v2-test-types-go2g-v1, openclaw-v2-all-fd-hard-v1, mastra-heap4096-worker1-v1, openclaw-fd-hard-v1, openclaw-original-diagnostic-v1]
      sandbox_id:
        description: 'Previously created diagnostic guest ID; required for run/cleanup.'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: microsandbox-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/superrad-benchmarks'
    environment: privileged
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Execute bounded diagnostic lifecycle
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_CONFIG: ${{ inputs.configuration }}
          DIAGNOSTIC_SANDBOX_ID: ${{ inputs.sandbox_id }}
          MSB_API_URL: ${{ secrets.MSB_API_URL }}
          MSB_API_KEY: ${{ secrets.MSB_API_KEY }}
          BENCH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BENCH_REPO_REF: ${{ github.sha }}
          BENCH_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun apps/cli/src/bin/diagnose-microsandbox.ts
      - name: Cleanup fallback
        if: always() && inputs.mode == 'run'
        env:
          DIAGNOSTIC_MODE: cleanup
          DIAGNOSTIC_CONFIG: ${{ inputs.configuration }}
          DIAGNOSTIC_SANDBOX_ID: ${{ inputs.sandbox_id }}
          MSB_API_URL: ${{ secrets.MSB_API_URL }}
          MSB_API_KEY: ${{ secrets.MSB_API_KEY }}
        run: bun apps/cli/src/bin/diagnose-microsandbox.ts
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-${{ github.run_id }}
          path: diagnostic-results/
          if-no-files-found: warn
          retention-days: 30
